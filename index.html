<style>body{background:#0d1117;color:#c9d1d9;font-family:system-ui,sans-serif;margin:0}
.header{text-align:center;padding:50px 20px 30px;background:linear-gradient(135deg,#0d1117,#161b22)}
.header h1{font-size:2.5em;color:#3fb950;margin:0}

.cart-bar{position:fixed;top:0;right:0;background:#161b22;border:1px solid #3fb950;border-radius:0 0 0 12px;padding:10px 20px;z-index:100}
.cart-bar span{color:#3fb950;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;padding:20px;max-width:1200px;margin:0 auto}
.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:16px;transition:transform .2s}
.card:hover{transform:translateY(-3px);border-color:#3fb950}
.card img{width:100%;height:200px;object-fit:cover;border-radius:8px}
.card h3{color:#3fb950;margin:10px 0 5px;font-size:1.1em}
.card p{color:#8b949e;font-size:.9em;margin:5px 0}
.price{color:#3fb950;font-size:1.3em;font-weight:bold}
.old{color:#484f58;text-decoration:line-through;font-size:.9em}
.badge{display:inline-block;background:rgba(255,255,255,.08);color:#3fb950;padding:2px 8px;border-radius:6px;font-size:.8em;margin:2px}
.btn{background:#3fb95022;color:#3fb950;border:1px solid #3fb950;border-radius:6px;padding:6px 14px;cursor:pointer;margin-top:8px;font-size:.9em}
.btn:hover{background:#3fb95044}
.footer{text-align:center;padding:40px;color:#484f58}
.loading{text-align:center;padding:60px;color:#484f58}</style>
